<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>CrèmeCraft — Atelier admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><script defer src="config.js"></script><script defer src="admin.js"></script></head><body class="admin"><main><a class="brand" href="index.html">CrèmeCraft<span>ATELIER ADMIN</span></a><h1>Your atelier,<br><em>at a glance.</em></h1><form id="login"><h2>Team sign in</h2><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button">Sign in →</button><p>Access is limited to explicitly authorized team members.</p></form><p id="status" role="status" aria-live="polite"></p><section id="dashboard" hidden><div class="toolbar"><h2>Enquiries & messages</h2><button id="refresh" class="button">Refresh</button><button id="logout" class="text-link">Sign out</button></div><label>Order status<select id="filter"><option value="">All statuses</option><option>pending</option><option>confirmed</option><option>preparing</option><option>completed</option><option>cancelled</option></select></label><div id="orders" class="admin-grid"></div><button id="more-orders" class="text-link">Load more enquiries</button><h2>Contact messages</h2><div id="messages" class="admin-grid"></div><button id="more-messages" class="text-link">Load more messages</button></section></main></body></html>
